eureka.region=default
eureka.name=SERVICE-REGISTRY
eureka.vipAddress=service-registry
eureka.port=8761
eureka.preferSameZone=true
eureka.shouldUseDns=false
# Self URL must come first so this node appears in registered-replicas and DS Replicas links.
# Override EUREKA_SELF_URL with the GCP internal hostname in production.
eureka.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/,http://vm-node-a.platform:8761/eureka/,http://vm-node-b.platform:8761/eureka/,http://vm-node-c.platform:8761/eureka/}
